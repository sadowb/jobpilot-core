[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobpilot"
version = "0.1.0"
description = "JobPilot backend: FastAPI + PostgreSQL + Celery workers driving BrowserOS Neo"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "sse-starlette==3.5.0",
  "uvicorn[standard]>=0.30",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "itsdangerous>=2.2",
  "celery[redis]>=5.5",
  "cryptography>=44",
]

[dependency-groups]
dev = ["ruff>=0.17", "mypy>=1.19", "celery-types>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 130
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]
ignore = ["S101", "S603", "S607", "E501", "S608"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.setuptools.package-data]
jobpilot = ["api/*.js"]
